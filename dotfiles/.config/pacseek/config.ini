# pacseek configuration
# Lines starting with '#' are comments. Remove the '#' to enable a setting.

# Initial view when pacseek starts: browse | installed | updates | orphans | collections
# view = browse

# Initial source filter: all | pacman | aur | flatpak | homebrew | npm | bun | pnpm
# (the SOURCES axis; pick aur to open on a live AUR search box)
# source = all

# Initial sort order: size | name
# sort = size

# Preferred AUR helper, overriding auto-detection. Must speak pacman syntax
# (-S / -Syu). Auto-detected in order: paru, yay, pikaur, trizen.
# aur_helper = paru

# Color theme: default | tokyo-night | catppuccin-mocha | catppuccin-macchiato | gruvbox
theme = catppuccin-mocha

# Package managers to surface, comma-separated: pacman (always on), aur,
# flatpak, homebrew, npm, bun, pnpm. Governs which sources load and which
# legend/filter entries appear. npm/bun/pnpm list globally-installed packages
# (npm install -g, etc.). Set on first run; edit here to change it later.
# package_managers = pacman, aur, flatpak

# Glyph set: unicode (default) or ascii. Use ascii on terminals that render
# symbol glyphs double-width or as boxes (alacritty, ghostty, tty console).
# glyphs = unicode

# Keybindings: rebind any single-key letter/symbol action with 'key_<action> = <char>'
# (e.g. 'key_sort = S'). The value must be exactly one non-space character; the
# structural keys (enter, space, esc, arrows, digits 1-5) are fixed and not listed.
# Two actions bound to the same key resolve first-match-wins - your problem to avoid.
# key_quit = q
# key_detail = d
# key_search = /
# key_sort = s
# key_update = u
# key_reason = r
# key_filter = f
# key_file_lookup = o
# key_help = ?
# key_collections_back = h
# key_export_list = x
# key_import_list = i
# key_mark_all = a
# key_clean_cache = c
# key_pacdiff = m
# key_refresh = y

# --- written by the first-run setup ---
package_managers = pacman, aur
glyphs = unicode
