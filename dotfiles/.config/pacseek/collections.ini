# pacseek user-defined collections
# Each [section] defines a collection; the section name is its id. Back this
# file up alongside config.ini to carry your collections to a new install.
#
# Malformed collections (missing name, empty package entry, duplicate id) are
# a hard error that names the offender and stops pacseek from starting.
# Packages that aren't installed or in the repos simply show as "unavailable".
#
# The optional 'manager' key names which package manager the collection's
# members install through - pacman (default), aur, flatpak, or homebrew - and
# tags the collection in the picker so your own collections are told apart
# from the curated ones and pacman's groups.
#
# [my-setup]
# name = My Setup
# icon = ★
# description = My personal must-haves
# manager = aur
# packages = neovim, git, tmux, ripgrep
