<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  icons-in-terminal is a glyph-only font: every icon lives in the Unicode
  private-use area and the file contains no ordinary text glyphs.

  This rule appends it as a fallback for MesloLGS NF (and for anything that
  asks for plain monospace) so that:
    - normal characters keep coming from the terminal font
    - icon codepoints that the terminal font does not have come from
      icons-in-terminal instead of an unrelated fallback such as Adwaita Sans

  Shipped by mist-setup together with icons-in-terminal.ttf, which is deployed
  to ~/.local/share/fonts. No machine-specific paths are referenced.
-->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>MesloLGS NF</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>icons-in-terminal</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>icons-in-terminal</string>
    </edit>
  </match>
</fontconfig>
